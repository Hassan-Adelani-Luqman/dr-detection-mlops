# Render deployment config (Docker runtime), built from this repo's Dockerfile.
#
# Render injects PORT and the Dockerfile CMD binds to it; /health is the health
# check. The base model is baked into the image, so prediction works from a cold
# start. Storage is ephemeral: uploads, the database and retrained versions reset
# on every redeploy, and the APTOS replay buffer / evaluation set are not shipped
# (licence), so a retrain on Render uses the images uploaded through the app.
#
# RETRAIN_ENABLED switches the retraining feature on or off. TensorFlow training
# needs much more memory than prediction; on a small instance set it to "false"
# and the Retrain page explains that retraining is turned off, instead of the
# service being killed for running out of memory mid-retrain.
services:
  - type: web
    name: dr-detection-mlops
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: RETRAIN_ENABLED
        value: "true"
