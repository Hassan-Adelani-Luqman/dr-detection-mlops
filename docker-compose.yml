services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      # Persist uploaded images, the database, the registry, and retrained
      # model versions across container restarts.
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
