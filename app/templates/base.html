<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DR Detection MLOps{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#128065;</span>
      <a href="/" class="brand-name">DR&nbsp;Detection<span class="brand-sub">MLOps</span></a>
    </div>
    <nav class="nav">
      <a href="/" data-nav="home">Home</a>
      <a href="/predict" data-nav="predict">Predict</a>
      <a href="/upload" data-nav="upload">Upload</a>
      <a href="/retrain" data-nav="retrain">Retrain</a>
      <a href="/insights" data-nav="insights">Insights</a>
    </nav>
    <a href="/insights#model-status" class="status-pill" id="status-pill"
       title="Model service status (from /health)">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking…</span>
    </a>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Diabetic Retinopathy Detection &mdash; MLOps deployment</span>
    <span class="muted">Screening aid only &mdash; not a substitute for clinical diagnosis.</span>
  </footer>

  <script>
    // Highlight the current page in the nav.
    (function () {
      const path = window.location.pathname;
      document.querySelectorAll('.nav a').forEach(a => {
        const href = a.getAttribute('href');
        if (href === path || (href !== '/' && path.startsWith(href))) {
          a.classList.add('active');
        } else if (href === '/' && path === '/') {
          a.classList.add('active');
        }
      });
    })();
  </script>
  <script>
    // Model up-time pill: polls /health every 15 s and ticks the uptime
    // forward every second in between.
    (function () {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      let base = null;   // { uptime: seconds, at: ms timestamp, version }

      function fmt(s) {
        s = Math.floor(s);
        const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
              m = Math.floor(s % 3600 / 60), sec = s % 60;
        if (d) return `${d}d ${h}h`;
        if (h) return `${h}h ${m}m`;
        if (m) return `${m}m ${sec}s`;
        return `${sec}s`;
      }
      function render() {
        if (!base) return;
        const up = base.uptime + (Date.now() - base.at) / 1000;
        text.textContent = `Online · up ${fmt(up)} · ${base.version}`;
      }
      async function poll() {
        try {
          const r = await fetch('/health', { cache: 'no-store' });
          if (!r.ok) throw new Error(r.status);
          const h = await r.json();
          base = { uptime: h.uptime_seconds, at: Date.now(), version: h.active_version };
          dot.className = 'status-dot ' + (h.model_loaded ? 'ok' : 'warn');
          render();
        } catch (e) {
          base = null;
          dot.className = 'status-dot down';
          text.textContent = 'Offline';
        }
      }
      poll();
      setInterval(poll, 15000);
      setInterval(render, 1000);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
