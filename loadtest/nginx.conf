# Round-robin load balancer for the `web` replicas.
#
# nginx resolves the service name `web` once at start-up, getting one IP per
# replica from Docker's DNS, and spreads requests across them in turn. After
# `docker compose up --scale web=N`, run `docker compose restart lb` so it picks
# up the new set of replicas.
upstream web_pool {
    server web:8000;
}

server {
    listen 80;

    # Fundus photographs are several MB; nginx's default limit is 1 MB.
    client_max_body_size 20m;

    location / {
        proxy_pass http://web_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;     # retraining status polls, slow predictions under load
        proxy_send_timeout 600s;
    }
}
